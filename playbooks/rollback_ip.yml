---
# Job template: r8to9-06-rollback-ip (approval required, Limit: rocky8_old:rocky9_new)
# OPTIONAL, like switch_ip.yml: the rollback may also be done from the console.
#
# Flow:
#   1. new VM: stop batch, release the service IP (the temporary IP stays, so SSH survives)
#   2. old VM: reached through its isolated IP, wait until the service IP is free,
#              take it back and announce it with gratuitous ARP (one detached task)
#   3. old VM: reached through the service IP again, health check, restore batch
#
# Required extra variables: confirm_rollback=true, service_ip, old_isolated_ip (and ip_prefix if not 24).
# Rollback condition: failed health check or service check, or the work window is exceeded.
- name: Release the service IP on the new VM
  hosts: rocky9_new
  become: true
  gather_facts: true
  tasks:
    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - confirm_rollback | default(false) | bool
          - service_ip | length > 0
          - old_isolated_ip | length > 0
        fail_msg: "Set confirm_rollback=true, service_ip and old_isolated_ip"
        quiet: true

    - name: Detect the NetworkManager connection of the interface
      ansible.builtin.command:
        argv: [nmcli, -g, GENERAL.CONNECTION, device, show, "{{ net_iface }}"]
      register: nm_conn_detect
      changed_when: false
      when: nm_connection | length == 0

    - name: Remember the connection name and the temporary IP
      ansible.builtin.set_fact:
        nm_conn_name: "{{ nm_connection if nm_connection | length > 0 else nm_conn_detect.stdout | trim }}"
        temp_ip: "{{ new_temp_ip | default(ansible_host, true) }}"

    - name: Stop batch jobs on the new VM (prevents double execution)
      ansible.builtin.include_role:
        name: batch_control
      vars:
        batch_state: disabled

    - name: Keep only the temporary IP on the new VM
      ansible.builtin.shell:
        cmd: |
          nmcli connection modify "{{ nm_conn_name }}" ipv4.method manual ipv4.addresses "{{ temp_ip }}/{{ ip_prefix }}"
          nmcli device reapply {{ net_iface }}
      changed_when: true

- name: Give the service IP back to the old VM
  hosts: rocky8_old
  become: true
  gather_facts: true
  vars:
    # Plays vars win over inventory host vars, so the old VM is reached at its isolated IP here.
    ansible_host: "{{ rollback_old_connect_ip | default(old_isolated_ip, true) }}"
  tasks:
    - name: Detect the NetworkManager connection of the interface
      ansible.builtin.command:
        argv: [nmcli, -g, GENERAL.CONNECTION, device, show, "{{ net_iface }}"]
      register: nm_conn_detect
      changed_when: false
      when: nm_connection | length == 0

    - name: Remember the connection name
      ansible.builtin.set_fact:
        nm_conn_name: "{{ nm_connection if nm_connection | length > 0 else nm_conn_detect.stdout | trim }}"

    - name: Wait until nobody answers for the service IP (duplicate address detection)
      ansible.builtin.command:
        argv: [arping, -D, -I, "{{ net_iface }}", -c, "2", "{{ service_ip }}"]
      register: dad
      until: dad.rc == 0
      retries: 10
      delay: 3
      changed_when: false
      failed_when: false

    - name: The service IP must be free before it is assigned
      ansible.builtin.assert:
        that:
          - dad.rc == 0
        fail_msg: "Another host still answers for {{ service_ip }}; not assigning it"
        quiet: true

    - name: Restore the service IP and announce it (detached, the SSH session drops)
      ansible.builtin.shell:
        cmd: |
          sleep 3
          nmcli connection modify "{{ nm_conn_name }}" ipv4.method manual ipv4.addresses "{{ service_ip }}/{{ ip_prefix }}"
          nmcli device reapply {{ net_iface }}
          arping -U -I {{ net_iface }} -c 3 {{ service_ip }}
          arping -A -I {{ net_iface }} -c 3 {{ service_ip }}
          ip neigh flush dev {{ net_iface }}
      async: 180
      poll: 0
      changed_when: true

- name: Verify and restore the old VM
  hosts: rocky8_old
  become: true
  gather_facts: false
  tasks:
    - name: Wait until the old VM answers at the service IP
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Health check of the service address from the EE
      ansible.builtin.uri:
        url: "{{ cutover_health_url }}"
        status_code: 200
        validate_certs: false
        timeout: 5
      delegate_to: localhost
      become: false
      register: rollback_health
      retries: 30
      delay: 2
      until: rollback_health is succeeded
      when: cutover_health_url | length > 0

    - name: Restore batch jobs on the old VM
      ansible.builtin.include_role:
        name: batch_control
      vars:
        batch_state: enabled
