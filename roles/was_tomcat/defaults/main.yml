---
tomcat_user: tomcat
tomcat_group: tomcat
# Optional fixed ids so that file ownership matches the old VM (unset = automatic)
# tomcat_uid: 992
# tomcat_gid: 988
tomcat_user_home: /home/tomcat
tomcat_install_root: /data
tomcat_home: /data/tomcat
tomcat_version: ""
tomcat_tarball_url: ""
tomcat_tarball_checksum: ""
jdk_package: java-17-openjdk-headless
java_home: /usr/lib/jvm/jre
tomcat_java_opts: "-Xms512m -Xmx1024m -Dfile.encoding=UTF-8"
tomcat_http_port: 8080
tomcat_open_firewall: false
tomcat_webapps: []
