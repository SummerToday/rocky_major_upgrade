---
# Variables for the new Rocky 9 VM. Fill in the empty values for your environment.

apache_enabled: true
tomcat_enabled: true

# --- Tomcat / JDK (installed fresh on Rocky 9; never copy binaries from the old VM) ---
# Layout and ids mirror the old VM: /data/apache-tomcat-<version> with the /data/tomcat symlink
jdk_package: java-17-openjdk-headless
tomcat_version: "9.0.123"     # exact version running on the old VM
tomcat_tarball_url: "https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.123/bin/apache-tomcat-9.0.123.tar.gz"
tomcat_tarball_checksum: ""   # optional, for example sha512:<hash>
tomcat_install_root: /data
tomcat_home: /data/tomcat
tomcat_uid: 992
tomcat_gid: 988
tomcat_http_port: 8080
tomcat_java_opts: "-Xms512m -Xmx1024m -Dfile.encoding=UTF-8"
tomcat_open_firewall: false   # the old VM does not allow 8080 in firewalld either
# Web applications to deploy on top of the default ones, for example:
#   - name: app
#     url: https://<internal artifact server>/app.war
#     checksum: sha256:<hash>
tomcat_webapps: []

# --- Apache (built from source: the old binary links OpenSSL 1.1, Rocky 9 only has OpenSSL 3) ---
apache_version: "2.4.69"      # exact version running on the old VM
apache_tarball_url: "https://archive.apache.org/dist/httpd/httpd-2.4.69.tar.gz"
apache_tarball_checksum: ""   # optional, for example sha256:<hash>
apache_install_root: /data
apache_uid: 990
apache_gid: 987
apache_http_port: 80
apache_open_firewall_ports:
  - "80/tcp"
apache_httpd_bin: /data/httpd/bin/httpd
# The old VM has no reverse proxy (Apache and Tomcat answer on their own ports).
# Example: [{ path: /, target: "http://127.0.0.1:8080/" }]
apache_proxy_rules: []

# --- Post-deploy checks (requested from the VM itself; same URLs as the old VM baseline) ---
health_checks:
  - url: "http://127.0.0.1:80/"
  - url: "http://127.0.0.1:8080/"

# --- Batch / cron jobs stay disabled on the new VM until cutover ---
batch_units: []
batch_manage_crond: false
