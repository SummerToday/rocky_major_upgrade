#   ansible_host: <new temporary IP>
#   server_role: web_was
#   server_type: single
#
# Groups: r8to9_test (parent) with the children rocky8_old and rocky9_new
#
# Inventory variables (applies to every host)
ansible_python_interpreter: auto_silent
