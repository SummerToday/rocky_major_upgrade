---
common_timezone: Asia/Seoul
common_require_selinux_enforcing: true
common_base_packages:
  - firewalld
  - chrony
  - rsync
  - iputils
  - policycoreutils-python-utils
  - audit
  # Needed by ansible.builtin.unarchive for the .tar.gz packages (missing on minimal images)
  - tar
  - gzip
# Application data directory shared by the web and WAS roles (same layout as the old VM)
common_data_dir: /data
