---
# Job template: r8to9-04-validate (read-only, Limit: rocky9_new)
# Pre-cutover validation. Any failed assertion means: stop the cutover.
- name: Validate the new Rocky 9 VM before cutover
  hosts: rocky9_new
  become: true
  gather_facts: true
  vars:
    validate_ignored_failed_units:
      - man-db-cache-update
  tasks:
    - name: Collect failed systemd units  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl --failed --no-legend --plain
      register: failed_units
      changed_when: false

    # Transient run-*.service units that dnf scriptlets start (man-db cache refresh) can end up failed
    # without touching the application services, so they are reported but do not block the cutover
    - name: Split the failed units into blocking and ignored ones
      ansible.builtin.set_fact:
        blocking_failed_units: >-
          {{ failed_units.stdout_lines
             | reject('search', validate_ignored_failed_units | join('|'))
             | list }}
        ignored_failed_units: >-
          {{ failed_units.stdout_lines
             | select('search', validate_ignored_failed_units | join('|'))
             | list }}

    - name: Show the ignored failed units
      ansible.builtin.debug:
        msg: "Ignored failed units (informational): {{ ignored_failed_units }}"
      when: ignored_failed_units | length > 0

    - name: No other systemd unit may be in failed state
      ansible.builtin.assert:
        that:
          - blocking_failed_units | length == 0
        fail_msg: "Failed units: {{ blocking_failed_units }}"
        quiet: true

    - name: Collect listening TCP ports
      ansible.builtin.shell: |
        set -o pipefail
        ss -lntH | awk '{print $4}' | awk -F: '{print $NF}' | sort -un
      args:
        executable: /bin/bash
      register: listen_now
      changed_when: false

    - name: Compute baseline ports that are not listening
      ansible.builtin.set_fact:
        missing_ports: "{{ baseline_ports | map('string') | list | difference(listen_now.stdout_lines) }}"

    - name: Every baseline port must be listening
      ansible.builtin.assert:
        that:
          - missing_ports | length == 0
        fail_msg: "Ports missing compared with the old VM: {{ missing_ports }}"
        quiet: true

    - name: Read the cgroup filesystem type
      ansible.builtin.command: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs
      changed_when: false

    - name: Rocky 9 uses cgroup v2
      ansible.builtin.assert:
        that:
          - cgroup_fs.stdout | trim == 'cgroup2fs'
        quiet: true

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Apache (source build) must be running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['httpd-custom.service'].state == 'running'
        fail_msg: "httpd-custom.service is not running"
        quiet: true
      when: apache_enabled | default(true) | bool

    - name: Tomcat must be running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['tomcat.service'].state == 'running'
        fail_msg: "tomcat.service is not running"
        quiet: true
      when: tomcat_enabled | default(true) | bool

    - name: Apache configuration must be valid
      ansible.builtin.command: "{{ apache_httpd_bin | default('httpd') }} -t"
      register: httpd_test
      changed_when: false
      when: apache_enabled | default(true) | bool

    - name: Run HTTP health checks
      ansible.builtin.uri:
        url: "{{ item.url }}"
        status_code: "{{ item.status | default(200) }}"
        validate_certs: "{{ item.validate_certs | default(false) }}"
        timeout: 10
      loop: "{{ health_checks }}"
      register: health_result
      retries: 5
      delay: 5
      until: health_result is succeeded

    - name: Look for recent SELinux denials
      ansible.builtin.command: ausearch -m avc -ts recent
      register: avc_recent
      changed_when: false
      failed_when: false

    - name: Report SELinux denials (informational)
      ansible.builtin.debug:
        msg: "{{ avc_recent.stdout_lines }}"
      when: avc_recent.rc == 0

    # Compare how the new VM is built against the old VM, key by key.
    # The same read-only script runs on both hosts; the old VM is reached with delegate_to.
    - name: Take the state snapshot on the new VM
      ansible.builtin.script:
        cmd: "files/state_snapshot.sh {{ apache_httpd_bin }} {{ tomcat_home }} {{ compare_http_ports | join(',') }}"
      register: snap_new
      changed_when: false
      when: compare_with_old_vm | bool

    - name: Take the same state snapshot on the old VM
      ansible.builtin.script:
        cmd: "files/state_snapshot.sh {{ apache_httpd_bin }} {{ tomcat_home }} {{ compare_http_ports | join(',') }}"
      delegate_to: "{{ groups['rocky8_old'][0] }}"
      register: snap_old
      changed_when: false
      when: compare_with_old_vm | bool

    - name: Turn the snapshots into dictionaries
      ansible.builtin.set_fact:
        state_new: >-
          {{ dict(snap_new.stdout_lines | map('regex_replace', '^([^=]*)=.*$', '\1')
             | zip(snap_new.stdout_lines | map('regex_replace', '^[^=]*=', ''))) }}
        state_old: >-
          {{ dict(snap_old.stdout_lines | map('regex_replace', '^([^=]*)=.*$', '\1')
             | zip(snap_old.stdout_lines | map('regex_replace', '^[^=]*=', ''))) }}
      when: compare_with_old_vm | bool

    - name: Compare every key of the two snapshots
      ansible.builtin.set_fact:
        compare_rows: >-
          {%- set rows = [] -%}
          {%- for k in (state_old.keys() | list + state_new.keys() | list) | unique | sort -%}
          {%- set ns = namespace(info=false) -%}
          {%- for pre in compare_informational_prefixes -%}
          {%- if k.startswith(pre) -%}{%- set ns.info = true -%}{%- endif -%}
          {%- endfor -%}
          {%- set o = state_old.get(k, '(missing)') -%}
          {%- set n = state_new.get(k, '(missing)') -%}
          {%- set _ = rows.append({'key': k, 'old': o, 'new': n, 'same': o == n, 'info': ns.info}) -%}
          {%- endfor -%}
          {{ rows }}
      when: compare_with_old_vm | bool

    - name: Report the comparison (SAME, INFO = differs by design, DIFF = must match)
      ansible.builtin.debug:
        msg: >-
          {%- set lines = [] -%}
          {%- for r in compare_rows -%}
          {%- if r.same -%}
          {%- set _ = lines.append('SAME  ' ~ r.key ~ '  ' ~ (r.old | truncate(100))) -%}
          {%- else -%}
          {%- set _ = lines.append(('INFO' if r.info else 'DIFF') ~ '  ' ~ r.key ~ '  old=' ~ r.old ~ '  new=' ~ r.new) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ lines }}
      when: compare_with_old_vm | bool

    - name: The new VM must be built like the old VM
      ansible.builtin.assert:
        that:
          - compare_rows | rejectattr('same') | rejectattr('info') | list | length == 0
        fail_msg: >-
          Differences from the old VM: {{ compare_rows | rejectattr('same') | rejectattr('info') | map(attribute='key') | list }}
        quiet: true
      when: compare_with_old_vm | bool and compare_fail_on_diff | bool

    - name: Validation summary
      ansible.builtin.debug:
        msg:
          failed_units: "{{ blocking_failed_units }}"
          ignored_failed_units: "{{ ignored_failed_units }}"
          differs_from_old_vm: >-
            {{ (compare_rows | default([]) | rejectattr('same') | rejectattr('info') | map(attribute='key') | list)
               if compare_with_old_vm | bool else 'not compared' }}
          missing_ports: "{{ missing_ports }}"
          cgroup_fs: "{{ cgroup_fs.stdout }}"
          health_checks: "{{ health_checks | map(attribute='url') | list }}"
          selinux_denials_found: "{{ avc_recent.rc == 0 }}"
