---
# Job template: r8to9-01-collect (read-only, Limit: rocky8_old)
# Collects the Rocky 8 -> 9 compatibility data from the old VM.
# Everything is discovered on the server itself (running processes, listening ports,
# mounts, server configuration), so no path has to be typed in. The variables
# binary_paths / cert_paths / script_dirs / xfs_mount_points are optional additions.
# Changed OS package files trigger follow-up checks automatically (see "Package drift").
# Results stay in the job output: the EE container is removed after the job.
# Download the output via the API if needed: /api/v2/jobs/<id>/stdout/?format=txt
- name: Collect compatibility data from the old VM
  hosts: rocky8_old
  gather_facts: true
  become: true
  vars:
    binary_paths: []          # optional: extra executables/libraries to check for OpenSSL linkage
    cert_paths: []            # optional: extra certificate files to check
    script_dirs: []           # optional: extra directories to scan for cgroup v1 paths
    xfs_mount_points: []      # optional: extra mount points for xfs_info
    apache_bin_override: ""   # set only when the web server is not found behind a listening port
    tomcat_home_override: ""  # set only when Tomcat is not found behind a listening port
    collect_rpm_va: true      # verify all RPM-owned files (niced, read-only); false skips it
    rpm_va_timeout: 900       # seconds before rpm -Va is stopped (partial output is kept)
  tasks:
    - name: OS release
      ansible.builtin.command: cat /etc/rocky-release
      register: os_release
      changed_when: false

    - name: Loaded kernel modules located outside /kernel/ (external candidates)
      ansible.builtin.shell: |
        set -o pipefail
        lsmod | awk 'NR>1{print $1}' | xargs -I{} modinfo -F filename {} 2>/dev/null | grep -v '/kernel/' || true
      args:
        executable: /bin/bash
      register: ext_modules
      changed_when: false

    - name: DKMS status
      ansible.builtin.shell: dkms status 2>/dev/null || true
      register: dkms_status
      changed_when: false

    - name: Runtime versions
      ansible.builtin.shell: |
        python3 -V 2>&1
        php -v 2>&1 | head -1
        java -version 2>&1 | head -1
        exit 0
      register: runtimes
      changed_when: false

    - name: Required CPU flags for x86-64-v2
      ansible.builtin.shell: |
        for f in cx16 lahf_lm popcnt pni ssse3 sse4_1 sse4_2; do
          grep -qw "$f" /proc/cpuinfo && echo "OK       $f" || echo "MISSING  $f"
        done
      register: cpu_flags
      changed_when: false

    - name: Binaries behind listening ports and their RPM owner (finds manually installed binaries)
      ansible.builtin.shell: |
        set -o pipefail
        ss -lntpH | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u | while read -r pid; do
          exe=$(readlink -f "/proc/${pid}/exe")
          owner=$(rpm -qf "${exe}" 2>&1 | head -n 1)
          echo "${pid} ${exe} -> ${owner}"
        done || true
      args:
        executable: /bin/bash
      register: listen_bins
      changed_when: false

    - name: Discover non-RPM programs and libraries in use and check their OpenSSL linkage
      ansible.builtin.shell: |
        {{ shell_helpers }}
        echo "### non-RPM executables of running processes"
        exes=$(nonrpm_exes)
        echo "${exes}"
        echo "### non-RPM shared libraries mapped by running processes"
        libs=$(nonrpm_libs)
        echo "${libs}"
        echo "### OpenSSL linkage verdicts (REVIEW = links OpenSSL 1.x, MISSING = library not found)"
        extra="{{ binary_paths | map('quote') | join(' ') }}"
        ok_count=0
        for f in ${exes} ${libs} ${extra}; do
          [ -f "${f}" ] || continue
          out=$(ldd "${f}" 2>&1)
          case "${out}" in *"not a dynamic executable"*) continue ;; esac
          if echo "${out}" | grep -q 'not found'; then
            echo "[MISSING] ${f}"; echo "${out}" | grep 'not found' | sed -E 's/^[[:space:]]+/    /'
          fi
          if echo "${out}" | grep -qE 'lib(ssl|crypto)\.so\.(1\.1|10|1\.0)'; then
            echo "[REVIEW]  ${f}"; echo "${out}" | grep -E 'lib(ssl|crypto)' | sed -E 's/^[[:space:]]+/    /'
          elif echo "${out}" | grep -qE 'lib(ssl|crypto)\.so'; then
            ok_count=$((ok_count + 1))
          fi
        done
        echo "(files linking OpenSSL 3 or another non-1.x version: ${ok_count})"
        exit 0
      args:
        executable: /bin/bash
      register: ssl_link
      changed_when: false
      failed_when: false

    - name: Discover certificates (server configuration plus standard and install directories)
      ansible.builtin.shell: |
        {{ shell_helpers }}
        files=""
        web=$(find_web_bin "{{ apache_bin_override }}")
        if [ -n "${web}" ]; then
          case "$(basename "${web}")" in
            nginx) files="${files}"$'\n'"$(nginx_cert_files "${web}")" ;;
            *)     files="${files}"$'\n'"$(apache_cert_files "${web}")" ;;
          esac
          echo "web server: ${web}"
        fi
        tomcat_targets "{{ tomcat_home_override }}" | while IFS='|' read -r pid base home; do
          echo "tomcat base: ${base}"
        done
        for t in $(tomcat_targets "{{ tomcat_home_override }}"); do
          base=$(echo "${t}" | cut -d'|' -f2)
          files="${files}"$'\n'"$(tomcat_cert_files "${base}")"
        done
        dirs="/etc/pki/tls/certs /etc/httpd /etc/nginx /etc/letsencrypt/live"
        for e in $(nonrpm_exes); do
          p=$(scan_prefix "${e}"); [ -n "${p}" ] && dirs="${dirs} ${p}"
        done
        for t in $(tomcat_targets "{{ tomcat_home_override }}"); do
          dirs="${dirs} $(echo "${t}" | cut -d'|' -f2)/conf"
        done
        found=$(timeout 120 find ${dirs} -maxdepth 6 -type f -size -64k \
          \( -name '*.crt' -o -name '*.pem' -o -name '*.cer' -o -name '*.cert' \) \
          ! -name 'ca-bundle*' ! -path '*/ca-trust/*' ! -path '/etc/pki/java/*' 2>/dev/null)
        extra="{{ cert_paths | join(' ') }}"
        echo "### certificate report (configured + discovered; private keys and keystores are not read)"
        printf '%s\n' ${files} ${found} ${extra} | grep -v '^$' | sort -u | while read -r c; do
          [ -f "${c}" ] || { echo "[NOT-FOUND] ${c}"; continue; }
          cert_report "${c}" || true
        done
        exit 0
      args:
        executable: /bin/bash
      register: cert_info
      changed_when: false
      failed_when: false

    - name: Effective sshd root login setting
      ansible.builtin.shell: |
        set -o pipefail
        sshd -T | grep -i permitrootlogin
      args:
        executable: /bin/bash
      register: sshd_root
      changed_when: false

    - name: Find cgroup v1 usage in discovered scripts, units and install directories
      ansible.builtin.shell: |
        {{ shell_helpers }}
        roots="/etc/systemd/system /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly"
        roots="${roots} /var/spool/cron /usr/local/bin /usr/local/sbin /etc/profile.d /etc/init.d"
        for e in $(nonrpm_exes); do
          p=$(scan_prefix "${e}"); [ -n "${p}" ] && roots="${roots} ${p}"
        done
        for t in $(tomcat_targets "{{ tomcat_home_override }}"); do
          base=$(echo "${t}" | cut -d'|' -f2); home=$(echo "${t}" | cut -d'|' -f3)
          roots="${roots} ${base}/bin ${home}/bin"
        done
        roots="${roots} {{ script_dirs | map('quote') | join(' ') }}"
        roots=$(printf '%s\n' ${roots} | sort -u | while read -r r; do [ -e "${r}" ] && echo "${r}"; done)
        echo "### scanned roots"; echo "${roots}"
        echo "### matches (file:line)"
        controllers='cpu|cpuacct|cpuset|memory|blkio|devices|freezer|pids|net_cls|net_prio|hugetlb|perf_event|systemd'
        timeout 180 grep -rIsnE \
          --exclude='*.log' --exclude='*.out' --exclude='*.jar' --exclude='*.war' \
          --exclude-dir=logs --exclude-dir=webapps --exclude-dir=work --exclude-dir=temp \
          -e "/sys/fs/cgroup/(${controllers})" -e '^[[:space:]]*(CPUShares|MemoryLimit|BlockIO[A-Za-z]*)=' \
          ${roots} | head -n 200
        exit 0
      args:
        executable: /bin/bash
      register: cgroup_info
      changed_when: false
      failed_when: false

    - name: Java runtimes in use and their cgroup v2 support
      ansible.builtin.shell: |
        {{ shell_helpers }}
        javas=$(
          {
            for pid in $(listen_pids); do
              exe=$(readlink -f "/proc/${pid}/exe" 2>/dev/null)
              [ "$(basename "${exe}")" = "java" ] && echo "${exe}"
            done
            command -v java 2>/dev/null | xargs -r readlink -f
            ls /usr/lib/jvm/*/bin/java /usr/lib/jvm/*/jre/bin/java /usr/java/*/bin/java 2>/dev/null | xargs -r -n1 readlink -f
          } | sort -u
        )
        [ -n "${javas}" ] || { echo "(no java runtime found)"; exit 0; }
        for j in ${javas}; do echo "${j}: $(java_cgroup_v2_verdict "${j}")"; done
        exit 0
      args:
        executable: /bin/bash
      register: java_info
      changed_when: false
      failed_when: false

    - name: Legacy network configuration files
      ansible.builtin.shell: ls /etc/sysconfig/network-scripts/ 2>/dev/null || true
      register: ifcfg_files
      changed_when: false

    - name: Hand-written iptables rules
      ansible.builtin.shell: iptables-save 2>/dev/null || true
      register: iptables_rules
      changed_when: false

    - name: Filesystem types
      ansible.builtin.command: lsblk -f
      register: lsblk_result
      changed_when: false

    - name: XFS mounts and their feature flags (mounts are discovered)
      ansible.builtin.shell: |
        mounts=$(findmnt -rn -t xfs -o TARGET 2>/dev/null)
        [ -n "${mounts}" ] || mounts=$(awk '$3 == "xfs" {print $2}' /proc/mounts)
        mounts=$(printf '%s\n' ${mounts} {{ xfs_mount_points | map('quote') | join(' ') }} | grep -v '^$' | sort -u)
        [ -n "${mounts}" ] || { echo "(no XFS mount found)"; exit 0; }
        for m in ${mounts}; do
          echo "## ${m}"
          xfs_info "${m}" 2>&1 | grep -E 'crc=|ftype=|bigtime|inobtcount' | sed -E 's/^[[:space:]]+//'
        done
        exit 0
      register: xfs_info_out
      changed_when: false
      failed_when: false

    - name: Listening ports (baseline for validate)
      ansible.builtin.command: ss -lntp
      register: listen_ports
      changed_when: false

    - name: Package drift (rpm -Va) with automatic follow-up checks per changed file
      ansible.builtin.shell: |
        {{ shell_helpers }}
        out=$(nice -n 19 timeout {{ rpm_va_timeout }} rpm -Va 2>&1)
        rc=$?
        [ "${rc}" = "124" ] && echo "(rpm -Va stopped after {{ rpm_va_timeout }}s: the output is partial)"
        cfg=$(printf '%s\n' "${out}" | grep -E '^[^ ]{9} +c ' || true)
        miss=$(printf '%s\n' "${out}" | grep -E '^missing' || true)
        other=$(printf '%s\n' "${out}" | grep -vE '^[^ ]{9} +c |^missing' | grep . || true)
        n_cfg=$(printf '%s\n' "${cfg}" | grep -c .)
        n_miss=$(printf '%s\n' "${miss}" | grep -c .)
        n_other=$(printf '%s\n' "${other}" | grep -c .)
        echo "### summary: config_changed=${n_cfg} missing=${n_miss} other_changed=${n_other}"
        echo "### config files changed (c = configuration file, edited after install)"
        printf '%s\n' "${cfg}" | grep .
        echo "### missing files"
        printf '%s\n' "${miss}" | grep .
        echo "### other changed files (binaries, libraries; first 50)"
        printf '%s\n' "${other}" | grep . | head -n 50
        echo "### content of changed config files (comments stripped, secrets masked)"
        n=0
        for f in $(printf '%s\n' "${cfg}" | awk 'NF {print $NF}'); do
          n=$((n + 1))
          if [ "${n}" -gt 40 ]; then echo "(more than 40 files: the rest is omitted)"; break; fi
          case "${f}" in
            */file_contexts.local) f_selinux=1 ;;
            /etc/ssh/*) f_ssh=1 ;;
            /etc/systemd/*) f_systemd=1 ;;
            /etc/chrony*) f_chrony=1 ;;
            /etc/crypto-policies/*) f_crypto=1 ;;
            /etc/sudoers|/etc/sudoers.d/*) f_sudo=1 ;;
            /etc/fstab) f_fstab=1 ;;
          esac
          [ -f "${f}" ] || continue
          if [ "$(stat -c %s "${f}")" -ge 65536 ]; then echo "-- ${f} (larger than 64KB, skipped)"; continue; fi
          if ! grep -Iq . "${f}"; then echo "-- ${f} (empty or binary, skipped)"; continue; fi
          echo "-- ${f}"; strip_conf "${f}" | mask | head -n 80
        done
        echo "### follow-up checks chosen from the changed files"
        if [ -n "${f_selinux}" ]; then
          echo "-- SELinux local rules changed: semanage fcontext -l -C"
          if command -v semanage >/dev/null 2>&1; then semanage fcontext -l -C 2>&1 | head -n 60; else echo "(semanage not installed)"; fi
        fi
        if [ -n "${f_ssh}" ]; then
          echo "-- sshd configuration changed: effective values"
          ssh_keys='permitrootlogin|passwordauthentication|pubkeyauthentication|port|allowusers|allowgroups|clientaliveinterval'
          ssh_keys="${ssh_keys}|ciphers|macs|kexalgorithms|hostkeyalgorithms|pubkeyacceptedalgorithms"
          sshd -T 2>&1 | grep -iE "^(${ssh_keys}) "
        fi
        if [ -n "${f_systemd}" ]; then
          echo "-- systemd configuration changed: systemd-delta"
          systemd-delta --no-pager --type=overridden,extended 2>&1 | head -n 50
        fi
        if [ -n "${f_chrony}" ]; then
          echo "-- chrony configuration changed: time sources"
          chronyc sources 2>&1 | head -n 10
        fi
        if [ -n "${f_crypto}" ]; then
          echo "-- crypto policy changed: current policy"
          update-crypto-policies --show 2>&1
        fi
        if [ -n "${f_sudo}" ]; then
          echo "-- sudoers changed: syntax check"
          visudo -c 2>&1 | head -n 10
        fi
        if [ -n "${f_fstab}" ]; then
          echo "-- fstab changed: current mounts of non-pseudo filesystems"
          findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS 2>&1 | grep -E ' (xfs|ext[234]|nfs[34]?|cifs|btrfs|vfat) ' | head -n 30
        fi
        exit 0
      args:
        executable: /bin/bash
      register: package_drift
      changed_when: false
      failed_when: false
      when: collect_rpm_va | bool

    - name: SELinux details that rpm -Va cannot see (mode, local rules, labels, dry-run relabel, denials)
      ansible.builtin.shell: |
        {{ shell_helpers }}
        mode=$(getenforce 2>/dev/null || echo unknown)
        echo "mode: ${mode}"
        sestatus 2>/dev/null | head -n 12
        echo "### local customisations (semanage)"
        if command -v semanage >/dev/null 2>&1; then
          echo "-- fcontext"; semanage fcontext -l -C 2>&1 | head -n 60
          echo "-- boolean"; semanage boolean -l -C 2>&1 | head -n 30
          echo "-- port"; semanage port -l -C 2>&1 | head -n 30
        else
          echo "(semanage not installed: policycoreutils-python-utils) local file contexts file:"
          strip_conf /etc/selinux/targeted/contexts/files/file_contexts.local 2>/dev/null
        fi
        paths=""
        web=$(find_web_bin "{{ apache_bin_override }}")
        if [ -n "${web}" ] && [ "$(basename "${web}")" != "nginx" ]; then paths="${paths} $(apache_root "${web}")"; fi
        for t in $(tomcat_targets "{{ tomcat_home_override }}"); do
          paths="${paths} $(echo "${t}" | cut -d'|' -f2) $(echo "${t}" | cut -d'|' -f3)"
        done
        for e in $(nonrpm_exes); do paths="${paths} $(scan_prefix "${e}")"; done
        paths=$(printf '%s\n' ${paths} | grep -v '^$' | sort -u)
        if command -v semanage >/dev/null 2>&1; then
          echo "### local fcontext rules: does the path still exist? (stale rules need not be migrated)"
          semanage fcontext -l -C 2>/dev/null | awk '$1 ~ /^\// {print $1}' | while read -r rule; do
            lit=$(printf '%s' "${rule}" | sed -E 's/[][(){}.*+?|^$\\].*$//')
            if [ "${rule}" = "${lit}" ]; then
              if [ -e "${rule}" ]; then st=EXISTS; else st=MISSING; fi
            else
              dir=$(dirname "${lit}")
              if [ "${dir}" = "/" ]; then st=UNKNOWN; else
                hit=$(timeout 20 find "${dir}" -maxdepth 6 -regextype posix-extended -regex "${rule}" 2>/dev/null | head -n 1)
                if [ -n "${hit}" ]; then st=EXISTS; else st=MISSING; fi
              fi
            fi
            echo "[${st}] ${rule}"
          done
        fi
        echo "### SELinux domain of the web/WAS processes (confined domain = the rules above apply)"
        ps -eo pid=,user=,label=,comm=,args= 2>/dev/null | awk '$4 ~ /^(httpd|apache2|nginx|java)$/' | cut -c1-200 | head -n 20
        echo "### directory layout and symlinks around the application paths"
        for d in $(for p in ${paths}; do dirname "${p}"; done | sort -u); do
          echo "-- ${d}"; ls -l "${d}" 2>&1 | head -n 40
        done
        echo "### labels of discovered application paths"
        for p in ${paths}; do
          [ -d "${p}" ] || continue
          ls -Zd "${p}" 2>&1
          ls -Z "${p}" 2>&1 | head -n 12
        done
        if [ "${mode}" != "Disabled" ]; then
          echo "### dry-run relabel (restorecon -Rnv changes nothing): entries that differ from the policy"
          for p in ${paths}; do
            [ -d "${p}" ] || continue
            echo "-- ${p}"; timeout 120 restorecon -Rnv "${p}" 2>&1 | head -n 30
          done
          echo "### AVC denials since boot (last 20)"
          ausearch -m AVC,USER_AVC -ts boot -i 2>&1 | tail -n 20
        fi
        exit 0
      args:
        executable: /bin/bash
      register: selinux_info
      changed_when: false
      failed_when: false

    - name: Boot parameters, cgroup mode, crypto policy and firewall
      ansible.builtin.shell: |
        echo "kernel cmdline: $(cat /proc/cmdline)"
        if grep -qE 'systemd.unified_cgroup_hierarchy=0|cgroup_no_v1' /proc/cmdline; then
          echo "[REVIEW] cmdline forces a cgroup mode; Rocky 9 uses cgroup v2 only"
        fi
        echo "cgroup filesystem: $(stat -fc %T /sys/fs/cgroup 2>&1) (cgroup2fs = v2, tmpfs = v1)"
        echo "crypto policy: $(update-crypto-policies --show 2>&1)"
        echo "### firewalld"
        if systemctl is-active firewalld >/dev/null 2>&1; then
          firewall-cmd --list-all 2>&1 | head -n 30
          allowed=$(firewall-cmd --list-ports 2>/dev/null)
          for svc in $(firewall-cmd --list-services 2>/dev/null); do
            allowed="${allowed} $(firewall-cmd --permanent --service="${svc}" --get-ports 2>/dev/null)"
          done
          echo "### listening TCP ports reachable from outside vs firewalld (default zone only, rich rules not evaluated)"
          ss -lntH 2>/dev/null | awk '{print $4}' | grep -vE '^(127\.|\[::1\]|\[::ffff:127\.)' | sed -E 's/.*:([0-9]+)$/\1/' | sort -un | while read -r port; do
            if echo " ${allowed} " | grep -qE "[[:space:]]${port}/tcp[[:space:]]"; then
              echo "[allowed]     ${port}/tcp"
            else
              echo "[NOT-ALLOWED] ${port}/tcp is listening but firewalld does not allow it"
            fi
          done
        else
          echo "(firewalld is not running)"
        fi
        exit 0
      args:
        executable: /bin/bash
      register: boot_info
      changed_when: false
      failed_when: false

    - name: Software and units outside the OS packages (third-party RPMs, repositories, /usr/local, custom units)
      ansible.builtin.shell: |
        {{ shell_helpers }}
        echo "### RPMs whose vendor is not Rocky (third-party packages)"
        rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{VENDOR}\n' 2>/dev/null \
          | awk -F'\t' '$1 !~ /^gpg-pubkey/ && $2 !~ /^Rocky/' | sort
        echo "### repositories"
        grep -hE '^(\[|baseurl|mirrorlist|metalink|enabled|gpgcheck)' /etc/yum.repos.d/*.repo 2>/dev/null
        echo "### files under /usr/local"
        find /usr/local -mindepth 2 -maxdepth 3 \( -type f -o -type l \) 2>/dev/null | head -n 60
        echo "### source-build options (config.nice) found next to the non-RPM programs"
        dirs=""
        for e in $(nonrpm_exes); do
          p=$(scan_prefix "${e}")
          [ -n "${p}" ] || continue
          dirs="${dirs} ${p}"
          [ "$(dirname "${p}")" != "/" ] && dirs="${dirs} $(dirname "${p}")"
        done
        for d in $(printf '%s\n' ${dirs} | sort -u); do
          timeout 30 find "${d}" -maxdepth 3 -type f -name config.nice 2>/dev/null
        done | sort -u | while read -r nice; do
          echo "-- ${nice}"
          grep -vE '^[[:space:]]*(#|$)' "${nice}" | mask | head -n 40
        done
        echo "### custom systemd units in /etc/systemd/system (full definition, secrets masked)"
        units=$(find /etc/systemd/system -maxdepth 1 -type f \
          \( -name '*.service' -o -name '*.timer' -o -name '*.socket' -o -name '*.mount' \) 2>/dev/null | sort)
        for u in ${units}; do
          name=$(basename "${u}")
          echo "-- ${name}: enabled=$(systemctl is-enabled "${name}" 2>&1) active=$(systemctl is-active "${name}" 2>&1)"
          systemctl cat "${name}" --no-pager 2>&1 | grep -vE '^[[:space:]]*$' | mask
          systemctl show "${name}" -p Type -p User -p Group -p LimitNOFILE -p PIDFile -p MainPID 2>&1
          grep -hE '^Exec(Start|Stop)=' "${u}" | sed -E 's/^Exec[A-Za-z]+=[-+@!:]*//' | awk '{print $1}' | sort -u | while read -r x; do
            echo "exec path: ${x} -> $(readlink -f "${x}" 2>&1)"
          done
        done
        exit 0
      args:
        executable: /bin/bash
      register: non_rpm_info
      changed_when: false
      failed_when: false

    - name: Mounts, fstab, service accounts and their limits
      ansible.builtin.shell: |
        {{ shell_helpers }}
        echo "### fstab"; strip_conf /etc/fstab 2>/dev/null
        echo "### mounted non-pseudo filesystems"
        findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS 2>/dev/null \
          | grep -vE ' (proc|sysfs|devtmpfs|devpts|tmpfs|cgroup2?|securityfs|selinuxfs|pstore|bpf|debugfs|tracefs|mqueue) '\
          | grep -vE ' (hugetlbfs|configfs|fusectl|autofs|binfmt_misc|rpc_pipefs|nsfs) '
        echo "### disk usage"
        df -hT -x tmpfs -x devtmpfs 2>&1
        echo "### accounts of listening programs (uid/gid must match on the new VM) and their limits"
        seen=""
        for pid in $(listen_pids); do
          exe=$(readlink -f "/proc/${pid}/exe" 2>/dev/null)
          case " ${seen} " in *" ${exe} "*) continue ;; esac
          seen="${seen} ${exe}"
          pids=$(for q in /proc/[0-9]*; do
            if [ "$(readlink -f "${q}/exe" 2>/dev/null)" = "${exe}" ]; then echo "${q#/proc/}"; fi
          done | paste -sd, -)
          echo "-- $(basename "${exe}") pids=${pids}"
          for user in $(ps -o user= -p "${pids}" 2>/dev/null | sort -u); do
            echo "   user ${user}: $(id "${user}" 2>&1)"
            echo "   passwd: $(getent passwd "${user}")"
          done
          grep -E '^Max (open files|processes)' "/proc/${pid}/limits" 2>/dev/null
        done
        exit 0
      args:
        executable: /bin/bash
      register: mounts_info
      changed_when: false
      failed_when: false

    - name: Show collected results
      ansible.builtin.debug:
        msg:
          os_release: "{{ os_release.stdout }}"
          external_modules: "{{ ext_modules.stdout_lines }}"
          dkms: "{{ dkms_status.stdout_lines }}"
          runtimes: "{{ runtimes.stdout_lines }}"
          cpu_flags: "{{ cpu_flags.stdout_lines }}"
          listening_binaries: "{{ listen_bins.stdout_lines }}"
          openssl_linkage: "{{ ssl_link.stdout_lines }}"
          certificates: "{{ cert_info.stdout_lines }}"
          sshd_root_login: "{{ sshd_root.stdout }}"
          cgroup_v1_usage: "{{ cgroup_info.stdout_lines }}"
          java_cgroup_v2: "{{ java_info.stdout_lines }}"
          network_scripts: "{{ ifcfg_files.stdout_lines }}"
